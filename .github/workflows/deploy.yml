# Builds the static site and publishes it to GitHub Pages on every push to main.
#
# While the site is served from https://bajorman.github.io/pristis/ the
# repository variable PAGES_BASE_PATH is set to "/pristis". Once
# www.pristismanagement.com points at GitHub Pages, delete that variable so
# the site is built for the domain root.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          # "1" only in the test repository (pristis-test): adds noindex.
          SITE_PREVIEW: ${{ vars.SITE_PREVIEW }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
